<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحميل الملف</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
font-family:Arial,sans-serif;background:linear-gradient(135deg,#111827,#2563eb);padding:20px}
.card{width:min(420px,100%);background:#fff;border-radius:24px;padding:30px;text-align:center;
box-shadow:0 20px 50px rgba(0,0,0,.25)}
.icon{font-size:58px;margin-bottom:10px}
h1{margin:8px 0 12px;font-size:25px;color:#111827;word-break:break-word}
.info{color:#6b7280;margin-bottom:24px}
.btn{display:block;text-decoration:none;background:#2563eb;color:white;padding:15px;
border-radius:14px;font-size:18px;font-weight:bold}
.btn:hover{background:#1d4ed8}
.small{font-size:12px;color:#9ca3af;margin-top:18px}
</style>
</head>
<body>
<div class="card">
<div class="icon">📦</div>
<h1>userbouquet.favourites.tv</h1>
<div class="info">حجم الملف: 0.01 MB</div>
<a class="btn" href="userbouquet.favourites.tv" download>⬇️ تحميل الملف</a>
<div class="small">اضغط على الزر لبدء التحميل</div>
</div>
</body>
</html>
